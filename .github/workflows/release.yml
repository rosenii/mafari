name: Build & Release APK

on:
  push:
    branches: [ main, gecko ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # tag → 正式 release；gecko 分支 → 预发布；其余只出 debug
      IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_GECKO_BRANCH: ${{ github.ref == 'refs/heads/gecko' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.2
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platform-tools
          key: android-sdk-${{ runner.os }}-37.0-36.0.0

      - name: Install Android SDK packages
        run: |
          set -x
          if [ -d "$ANDROID_HOME/platforms/android-37.2" ] && [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Android SDK packages cached, skip install"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
            exit 0
          fi
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37.2" "build-tools;36.0.0" 2>&1 | tail -5 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mafari-release.jks

      # main 或 无 keystore 的 gecko/tag：编 debug
      - name: Build debug
        if: env.IS_RELEASE_TAG != 'true' && env.IS_GECKO_BRANCH != 'true' || env.KEYSTORE_BASE64 == ''
        run: bash ./gradlew :app:assembleDebug --stacktrace

      # tag 或 gecko 且有签名：编 release
      - name: Build release
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        env:
          MAFARI_KEYSTORE: mafari-release.jks
          MAFARI_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MAFARI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAFARI_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          mkdir -p dist
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "release apk: [$SRC]"
          if [ -z "$SRC" ]; then
            echo "release 包缺失，改用 debug 包"
            SRC=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          fi
          echo "source apk: [$SRC]"
          if [ -z "$SRC" ]; then echo "没有可签名的 APK"; exit 0; fi
          cp "$SRC" dist/mafari-release-raw.apk
          cp "$SRC" dist/app-release.apk
          if [ -n "$STORE_PASSWORD" ] && [ -f mafari-release.jks ]; then
            "$SDK/zipalign" -f 4 dist/mafari-release-raw.apk dist/mafari-aligned.apk
            "$SDK/apksigner" sign --ks mafari-release.jks \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out dist/mafari-release-signed.apk dist/mafari-aligned.apk
          fi
          rm -f dist/mafari-release-raw.apk dist/mafari-aligned.apk
          ls -lh dist

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mafari-apk
          path: dist/*.apk
          if-no-files-found: error

      # tag 用 CHANGELOG 对应小节；gecko 分支写预发布说明
      - name: Prepare release notes
        if: env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true'
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          is_gecko = os.environ.get("IS_GECKO_BRANCH") == "true"
          run_no = os.environ.get("GITHUB_RUN_NUMBER", "")
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          text = ""
          p = pathlib.Path("CHANGELOG.md")
          if p.exists():
              text = p.read_text(encoding="utf-8")

          if is_gecko:
              header = f"## 预发布 gecko-{run_no}\n\n"
              body = (
                  "来自 `gecko` 分支的自动预发布构建。\n\n"
                  f"- 提交：`{sha}`\n"
                  f"- 分支：`gecko`\n"
              )
          else:
              ver = ref_name[1:] if ref_name.startswith("v") else ref_name
              pat = re.compile(
                  rf"^##\s*\[?v?{re.escape(ver)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
                  re.M | re.S,
              )
              m = pat.search(text)
              body = (m.group(1).strip() if m else "").strip()
              header = f"## {ref_name}\n\n"
              if not body:
                  body = "见 CHANGELOG.md 与提交历史。"

          out = header + body
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(out + "\n", encoding="utf-8")
          print(out)
          PY

      - name: Create GitHub Release
        if: env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true'
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          # tag 用 tag 名；gecko 自动生成 gecko-<run_number> 作为 tag
          tag_name: ${{ env.IS_RELEASE_TAG == 'true' && github.ref_name || format('gecko-{0}', github.run_number) }}
          # gecko 分支标预发布；不抢 latest
          prerelease: ${{ env.IS_GECKO_BRANCH == 'true' }}
          make_latest: ${{ env.IS_GECKO_BRANCH == 'true' && 'false' || 'true' }}

      # 同步推送到 Telegram 频道（正式版 + 预发布）。
      # 需要 Secrets：TELEGRAM_BOT_TOKEN（机器人需是频道管理员）；TELEGRAM_CHAT_ID 可选，默认 @mafari_a。
      # 没配 token 就跳过；推送失败不影响发布（continue-on-error）。
      - name: Notify Telegram
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.TG_TOKEN != ''
        continue-on-error: true
        env:
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '@mafari_a' }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG_NAME: ${{ env.IS_RELEASE_TAG == 'true' && github.ref_name || format('gecko-{0}', github.run_number) }}
        run: |
          python3 - <<'PY'
          import glob, html, json, os, pathlib, re, subprocess

          token = os.environ["TG_TOKEN"]
          chat = os.environ["TG_CHAT"]
          tag = os.environ["TAG_NAME"]
          is_gecko = os.environ.get("IS_GECKO_BRANCH") == "true"
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          url = os.environ.get("RELEASE_URL") or f"https://github.com/{repo}/releases/tag/{tag}"
          api = f"https://api.telegram.org/bot{token}"
          LIMIT = 49 * 1024 * 1024  # Bot API 上传上限 50 MB，留一点余量

          def call(method, fields, files=None):
              """用 curl 调 Bot API（不把 token 打进日志）；返回解析后的 JSON"""
              cmd = ["curl", "-sS", "--max-time", "600", f"{api}/{method}"]
              for k, v in fields.items():
                  cmd += ["--form-string", f"{k}={v}"]
              for k, path in (files or {}).items():
                  cmd += ["-F", f"{k}=@{path}"]
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)
              except Exception:
                  return {"ok": False, "description": (r.stderr or r.stdout)[:200]}

          # 正文：取 RELEASE_NOTES.md，去掉标题行，简单转成 Telegram 支持的 HTML
          notes = ""
          p = pathlib.Path("dist/RELEASE_NOTES.md")
          if p.exists():
              lines = p.read_text(encoding="utf-8").splitlines()
              notes = "\n".join(l for l in lines if not l.startswith("## ")).strip()

          def to_html(md):
              out = html.escape(md)
              out = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", out)
              out = re.sub(r"`([^`\n]+)`", r"<code>\1</code>", out)
              return out

          def clip(text, n):
              if len(text) <= n:
                  return text
              cut = text[:n].rsplit("\n", 1)[0]
              return cut + "\n…"

          title = f"🧪 Mafari 预发布 {tag}" if is_gecko else f"🚀 Mafari {tag}"
          apks = sorted(glob.glob("dist/*.apk"))
          pick = next((a for a in apks if a.endswith("mafari-release-signed.apk")), None) \
              or next((a for a in apks if a.endswith("app-release.apk")), None) \
              or (apks[0] if apks else None)
          too_big = bool(pick) and os.path.getsize(pick) > LIMIT

          raw_tail = f"\n\n下载 / Download: {url}"
          if too_big:
              raw_tail += "\n（安装包超过 Telegram 50MB 限制，请到上面的链接下载）"
          body = clip(notes, 3200)
          html_text = f"<b>{html.escape(title)}</b>\n\n{to_html(body)}" if body else f"<b>{html.escape(title)}</b>"
          html_text += f'\n\n<a href="{html.escape(url)}">下载 / Download</a>'
          if too_big:
              html_text += "\n（安装包超过 Telegram 50MB 限制，请到上面的链接下载）"

          res = call("sendMessage", {
              "chat_id": chat, "text": html_text, "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          })
          if not res.get("ok"):
              print("HTML 消息失败，改发纯文本：", res.get("description"))
              res = call("sendMessage", {
                  "chat_id": chat, "text": f"{title}\n\n{body}{raw_tail}".strip(),
                  "disable_web_page_preview": "true",
              })
          print("sendMessage:", res.get("ok"), res.get("description", ""))

          if pick and not too_big:
              res = call("sendDocument", {"chat_id": chat, "caption": title}, {"document": pick})
              print("sendDocument:", os.path.basename(pick), res.get("ok"), res.get("description", ""))
          if not res.get("ok"):
              raise SystemExit(1)
          PY
