name: Build & Release APK

on:
  push:
    branches: [ main, gecko, dual ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # tag → 正式 release；gecko 分支 → 预发布；其余只出 debug
      IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_GECKO_BRANCH: ${{ github.ref == 'refs/heads/gecko' }}
      # dual 分支：同时构建 gecko + lite 两个变体，直接发布为正式 release（tag = 应用版本名，如 v2.1.3，标 latest，进 lite / gecko 更新通道）；
      # 同一版本名重复构建会覆盖该 release 的安装包，要让用户收到更新请先提高版本名
      IS_DUAL_BRANCH: ${{ github.ref == 'refs/heads/dual' }}
      # 预发布分支（gecko 或 dual）：tag 前缀 = 分支名
      IS_PRE_BRANCH: ${{ github.ref == 'refs/heads/gecko' || github.ref == 'refs/heads/dual' }}
      PRE_PREFIX: ${{ github.ref == 'refs/heads/dual' && 'dual' || 'gecko' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.2
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platform-tools
          key: android-sdk-${{ runner.os }}-37.0-36.0.0

      - name: Install Android SDK packages
        run: |
          set -x
          if [ -d "$ANDROID_HOME/platforms/android-37.2" ] && [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Android SDK packages cached, skip install"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
            exit 0
          fi
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37.2" "build-tools;36.0.0" 2>&1 | tail -5 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # 应用版本名 / 版本号（取自 app/build.gradle.kts），用于 dual 预发布标题与更新日志匹配
      - name: Read app version
        run: |
          set -e
          NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          # 发布 tag：版本 tag 推送用 tag 名；dual 直接发布用应用版本名；gecko 预发布用 gecko-<构建号>
          if [ "$IS_RELEASE_TAG" = "true" ]; then RTAG="$GITHUB_REF_NAME"
          elif [ "$IS_DUAL_BRANCH" = "true" ]; then RTAG="$NAME"
          else RTAG="gecko-$GITHUB_RUN_NUMBER"; fi
          echo "RELEASE_TAG_NAME=$RTAG" >> "$GITHUB_ENV"
          echo "version: $NAME ($CODE)"

      - name: Prepare keystore
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_PRE_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mafari-release.jks

      # 两个变体一次编完（共用 miuix 与 Gradle 缓存）：
      #   gecko = 内嵌 GeckoView 的双内核版；lite = 无内核版（只用系统 WebView）
      # main 或 无 keystore 的 gecko/tag：编 debug
      - name: Build debug (gecko + lite)
        if: env.IS_RELEASE_TAG != 'true' && env.IS_PRE_BRANCH != 'true' || env.KEYSTORE_BASE64 == ''
        run: bash ./gradlew :app:assembleGeckoArm64Debug :app:assembleLiteArm64Debug :app:assembleLiteArm32Debug :app:assembleLiteX64Debug --stacktrace

      # tag 或 gecko 且有签名：编 release（Gradle 用 MAFARI_* 直接签名并 zipalign，无需再手工签）
      - name: Build release (gecko + lite)
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_PRE_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        env:
          MAFARI_KEYSTORE: mafari-release.jks
          MAFARI_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MAFARI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAFARI_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleGeckoArm64Release :app:assembleLiteArm64Release :app:assembleLiteArm32Release :app:assembleLiteX64Release --stacktrace

      # 打印 Firefox 账号 / Sync 库当前解析到的版本的真实 API 签名（构建成败都运行，供对照）
      - name: Dump Firefox Sync API
        if: always()
        continue-on-error: true
        run: bash tools/dump-fxa-api.sh

      # 统一命名：Mafari-<版本名>-gecko.apk、Mafari-<版本名>-lite-<架构>.apk
      # 应用内「检查更新」靠文件名里的 -gecko / -lite 选择与当前安装包同变体的那一个，改名请同步 AboutScreen.pickApkUrl
      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          # 文件名统一用版本名（去掉 v 前缀）：Mafari-2.1.3-gecko.apk、Mafari-2.1.3-lite-arm64-v8a.apk
          if [ "$IS_RELEASE_TAG" = "true" ]; then LABEL="${GITHUB_REF_NAME#v}"
          elif [ "$IS_PRE_BRANCH" = "true" ]; then LABEL="${APP_VERSION_NAME#v}"
          else LABEL="$(echo "$GITHUB_SHA" | cut -c1-7)-debug"; fi
          if [ -f mafari-release.jks ] && { [ "$IS_RELEASE_TAG" = "true" ] || [ "$IS_PRE_BRANCH" = "true" ]; }; then TYPE=release; else TYPE=debug; fi
          echo "label=$LABEL type=$TYPE"
          # 变体目录 : 输出名后缀（lite 按架构各一个包，gecko 只有 arm64）
          for ENTRY in geckoArm64:gecko liteArm64:lite-arm64-v8a liteArm32:lite-armeabi-v7a liteX64:lite-x86_64; do
            DIR=${ENTRY%%:*}; SUFFIX=${ENTRY##*:}
            SRC=$(ls app/build/outputs/apk/$DIR/$TYPE/*.apk 2>/dev/null | head -1)
            if [ -z "$SRC" ]; then echo "::error::缺少 $DIR/$TYPE 的 APK"; exit 1; fi
            cp "$SRC" "dist/Mafari-$LABEL-$SUFFIX.apk"
          done
          (cd dist && sha256sum Mafari-*.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mafari-apk
          path: dist/*.apk
          if-no-files-found: error

      # tag 用 CHANGELOG 对应小节；gecko 分支写预发布说明
      - name: Prepare release notes
        if: env.IS_RELEASE_TAG == 'true' || env.IS_PRE_BRANCH == 'true'
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          is_gecko = os.environ.get("IS_PRE_BRANCH") == "true"
          run_no = os.environ.get("GITHUB_RUN_NUMBER", "")
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          text = ""
          p = pathlib.Path("CHANGELOG.md")
          if p.exists():
              text = p.read_text(encoding="utf-8")

          def changelog_section(ver):
              """CHANGELOG 里版本 ver 的小节正文；找不到退回「未发布」小节"""
              for v in (ver, "未发布"):
                  pat = re.compile(
                      rf"^##\s*\[?v?{re.escape(v)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
                      re.M | re.S,
                  )
                  m = pat.search(text)
                  if m and m.group(1).strip():
                      return m.group(1).strip()
              return ""

          if is_gecko:
              prefix = os.environ.get("PRE_PREFIX", "gecko")
              app_name = os.environ.get("APP_VERSION_NAME", "")
              app_code = os.environ.get("APP_VERSION_CODE", "")
              header = f"## {app_name} ({app_code})\n\n"
              body = (
                  f"来自 `{prefix}` 分支的{'发布' if prefix == 'dual' else '自动预发布'}构建。\n\n"
                  f"- 提交：`{sha}`\n"
                  f"- 分支：`{prefix}`\n"
              )
              log = changelog_section(app_name[1:] if app_name.startswith("v") else app_name)
              if log:
                  body += f"\n### 更新日志\n\n{log}\n"
          else:
              ver = ref_name[1:] if ref_name.startswith("v") else ref_name
              pat = re.compile(
                  rf"^##\s*\[?v?{re.escape(ver)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
                  re.M | re.S,
              )
              m = pat.search(text)
              body = (m.group(1).strip() if m else "").strip()
              header = f"## {ref_name}\n\n"
              if not body:
                  body = "见 CHANGELOG.md 与提交历史。"

          variants = (
              "\n\n**安装包说明**\n\n"
              "- `-gecko.apk`：Gecko 版，内嵌 GeckoView（Nightly），WebView / Gecko 双内核，仅 arm64-v8a 设备\n"
              "- `-lite-<架构>.apk`：无内核版，不内嵌浏览器内核，只用系统 WebView，体积小；按架构分包：`arm64-v8a`（绝大多数手机）、`armeabi-v7a`（旧 32 位设备）、`x86_64`（模拟器 / x86 设备）\n"
          )
          out = header + body + variants
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(out + "\n", encoding="utf-8")
          print(out)
          PY

      - name: Create GitHub Release
        if: env.IS_RELEASE_TAG == 'true' || env.IS_PRE_BRANCH == 'true'
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          # tag 用 tag 名；gecko 自动生成 gecko-<run_number> 作为 tag
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          # dual 发布标题：应用版本名 (版本号)；其余沿用 tag 名
          name: ${{ env.IS_DUAL_BRANCH == 'true' && format('{0} ({1})', env.APP_VERSION_NAME, env.APP_VERSION_CODE) || '' }}
          # gecko 分支标预发布；不抢 latest
          prerelease: ${{ env.IS_GECKO_BRANCH == 'true' }}
          make_latest: ${{ env.IS_GECKO_BRANCH == 'true' && 'false' || 'true' }}

      # 同步推送到 Telegram 频道（正式版 + 预发布）。
      # 需要 Secrets：TELEGRAM_BOT_TOKEN（机器人需是频道管理员）；TELEGRAM_CHAT_ID 可选，默认 @mafari_a。
      # 没配 token 就跳过；推送失败不影响发布（continue-on-error）。
      - name: Notify Telegram
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_PRE_BRANCH == 'true') && env.TG_TOKEN != ''
        continue-on-error: true
        env:
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '@mafari_a' }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG_NAME: ${{ env.RELEASE_TAG_NAME }}
        run: |
          python3 - <<'PY'
          import glob, html, json, os, pathlib, re, subprocess

          token = os.environ["TG_TOKEN"]
          chat = os.environ["TG_CHAT"]
          tag = os.environ["TAG_NAME"]
          is_gecko = os.environ.get("IS_GECKO_BRANCH") == "true"  # 仅 gecko 分支是预发布；dual 是正式发布
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          url = os.environ.get("RELEASE_URL") or f"https://github.com/{repo}/releases/tag/{tag}"
          api = f"https://api.telegram.org/bot{token}"
          LIMIT = 49 * 1024 * 1024  # Bot API 上传上限 50 MB，留一点余量

          def call(method, fields, files=None):
              """用 curl 调 Bot API（不把 token 打进日志）；返回解析后的 JSON"""
              cmd = ["curl", "-sS", "--max-time", "600", f"{api}/{method}"]
              for k, v in fields.items():
                  cmd += ["--form-string", f"{k}={v}"]
              for k, path in (files or {}).items():
                  cmd += ["-F", f"{k}=@{path}"]
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)
              except Exception:
                  return {"ok": False, "description": (r.stderr or r.stdout)[:200]}

          # 正文：取 RELEASE_NOTES.md，去掉标题行，简单转成 Telegram 支持的 HTML
          notes = ""
          p = pathlib.Path("dist/RELEASE_NOTES.md")
          if p.exists():
              lines = p.read_text(encoding="utf-8").splitlines()
              notes = "\n".join(l for l in lines if not l.startswith("## ")).strip()

          def to_html(md):
              out = html.escape(md)
              out = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", out)
              out = re.sub(r"`([^`\n]+)`", r"<code>\1</code>", out)
              return out

          def clip(text, n):
              if len(text) <= n:
                  return text
              cut = text[:n].rsplit("\n", 1)[0]
              return cut + "\n…"

          app_name = os.environ.get("APP_VERSION_NAME") or tag
          title = f"🧪 Mafari 预发布 {app_name} ({os.environ.get('APP_VERSION_CODE', '')})" if is_gecko else f"🚀 Mafari {tag}"
          # 概述 + 安装包放在同一条消息里：安装包作为一组文档（相册）发出，概述作为第一个文档的 caption（上限 1024 字符）。
          # 超过 Bot API 上限的安装包不上传，只在 caption 里给下载链接
          apks = sorted(glob.glob("dist/*.apk"))
          sendable = [a for a in apks if os.path.getsize(a) <= LIMIT]
          too_big = len(sendable) < len(apks)
          CAP = 1024

          head_html = f"<b>{html.escape(title)}</b>"
          tail_html = f'\n\n<a href="{html.escape(url)}">下载 / Download</a>'
          tail_raw = f"\n\n下载 / Download: {url}"
          if too_big:
              tail_html += "\n（部分安装包超过 Telegram 50MB 限制，请到上面的链接下载）"
              tail_raw += "\n（部分安装包超过 Telegram 50MB 限制，请到上面的链接下载）"

          def build_caption(parse_html):
              head, tail = (head_html, tail_html) if parse_html else (title, tail_raw)
              body = notes
              while True:
                  text = to_html(body) if parse_html else body
                  cap = head + (("\n\n" + text) if text else "") + tail
                  if len(cap) <= CAP or not body:
                      return cap
                  # 逐步缩短概述直到放得下
                  body = clip(body, max(0, int(len(body) * 0.8) - 1))
                  if len(body) < 20:
                      body = ""

          def send_group(caption, parse_html):
              """一条消息发出所有安装包（多个用相册，单个用 sendDocument）"""
              fields = {"chat_id": chat, "caption": caption}
              if parse_html:
                  fields["parse_mode"] = "HTML"
              if len(sendable) == 1:
                  return call("sendDocument", fields, {"document": sendable[0]})
              media, files = [], {}
              for i, apk in enumerate(sendable):
                  item = {"type": "document", "media": f"attach://f{i}"}
                  if i == 0:
                      item["caption"] = caption
                      if parse_html:
                          item["parse_mode"] = "HTML"
                  media.append(item)
                  files[f"f{i}"] = apk
              return call("sendMediaGroup", {"chat_id": chat, "media": json.dumps(media)}, files)

          if sendable:
              res = send_group(build_caption(True), True)
              if not res.get("ok"):
                  print("HTML 消息失败，改发纯文本：", res.get("description"))
                  res = send_group(build_caption(False), False)
              print("send apks:", [os.path.basename(a) for a in sendable], res.get("ok"), res.get("description", ""))
          else:
              # 没有可上传的安装包：只发概述 + 链接
              res = call("sendMessage", {
                  "chat_id": chat, "text": build_caption(True), "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              })
              print("sendMessage:", res.get("ok"), res.get("description", ""))
          if not res.get("ok"):
              raise SystemExit(1)
          PY
