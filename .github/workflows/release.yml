name: Build & Release APK

on:
  push:
    branches: [ main, gecko ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # tag → 正式 release；gecko 分支 → 预发布；其余只出 debug
      IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_GECKO_BRANCH: ${{ github.ref == 'refs/heads/gecko' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platform-tools
          key: android-sdk-${{ runner.os }}-37.0-36.0.0

      - name: Install Android SDK packages
        run: |
          set -x
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Android SDK packages cached, skip install"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
            exit 0
          fi
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tail -5 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mafari-release.jks

      # main 或 无 keystore 的 gecko/tag：编 debug
      - name: Build debug
        if: env.IS_RELEASE_TAG != 'true' && env.IS_GECKO_BRANCH != 'true' || env.KEYSTORE_BASE64 == ''
        run: bash ./gradlew :app:assembleDebug --stacktrace

      # tag 或 gecko 且有签名：编 release
      - name: Build release
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        env:
          MAFARI_KEYSTORE: mafari-release.jks
          MAFARI_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MAFARI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAFARI_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        if: (env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true') && env.KEYSTORE_BASE64 != ''
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          mkdir -p dist
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "release apk: [$SRC]"
          if [ -z "$SRC" ]; then
            echo "release 包缺失，改用 debug 包"
            SRC=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          fi
          echo "source apk: [$SRC]"
          if [ -z "$SRC" ]; then echo "没有可签名的 APK"; exit 0; fi
          cp "$SRC" dist/mafari-release-raw.apk
          cp "$SRC" dist/app-release.apk
          if [ -n "$STORE_PASSWORD" ] && [ -f mafari-release.jks ]; then
            "$SDK/zipalign" -f 4 dist/mafari-release-raw.apk dist/mafari-aligned.apk
            "$SDK/apksigner" sign --ks mafari-release.jks \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out dist/mafari-release-signed.apk dist/mafari-aligned.apk
          fi
          rm -f dist/mafari-release-raw.apk dist/mafari-aligned.apk
          ls -lh dist

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mafari-apk
          path: dist/*.apk
          if-no-files-found: error

      # tag 用 CHANGELOG 对应小节；gecko 分支写预发布说明
      - name: Prepare release notes
        if: env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true'
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          is_gecko = os.environ.get("IS_GECKO_BRANCH") == "true"
          run_no = os.environ.get("GITHUB_RUN_NUMBER", "")
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          text = ""
          p = pathlib.Path("CHANGELOG.md")
          if p.exists():
              text = p.read_text(encoding="utf-8")

          if is_gecko:
              header = f"## 预发布 gecko-{run_no}\n\n"
              body = (
                  "来自 `gecko` 分支的自动预发布构建。\n\n"
                  f"- 提交：`{sha}`\n"
                  f"- 分支：`gecko`\n"
              )
          else:
              ver = ref_name[1:] if ref_name.startswith("v") else ref_name
              pat = re.compile(
                  rf"^##\s*\[?v?{re.escape(ver)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
                  re.M | re.S,
              )
              m = pat.search(text)
              body = (m.group(1).strip() if m else "").strip()
              header = f"## {ref_name}\n\n"
              if not body:
                  body = "见 CHANGELOG.md 与提交历史。"

          out = header + body
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(out + "\n", encoding="utf-8")
          print(out)
          PY

      - name: Create GitHub Release
        if: env.IS_RELEASE_TAG == 'true' || env.IS_GECKO_BRANCH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          # tag 用 tag 名；gecko 自动生成 gecko-<run_number> 作为 tag
          tag_name: ${{ env.IS_RELEASE_TAG == 'true' && github.ref_name || format('gecko-{0}', github.run_number) }}
          # gecko 分支标预发布；不抢 latest
          prerelease: ${{ env.IS_GECKO_BRANCH == 'true' }}
          make_latest: ${{ env.IS_GECKO_BRANCH == 'true' && 'false' || 'true' }}